name: Windows x64 preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++20 -Wall -Wextra -Werror tests/native_update_version.cpp -o /tmp/native-update-test && /tmp/native-update-test

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Windows x64 portable preview
        shell: pwsh
        run: msbuild native/windows/Nanhara.Board.InkDesktopHost/Nanhara.Board.InkDesktopHost.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Package and checksum
        shell: pwsh
        run: |
          $project = 'native/windows/Nanhara.Board.InkDesktopHost'
          $exe = Join-Path $project 'bin/x64/Release/NanharaBoardInkDesktopHost.exe'
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          $source = Get-Content (Join-Path $project 'update_version.h') -Raw
          if ($source -notmatch 'current_preview = ([1-9][0-9]*);' -or $version -ne "0.2.0-alpha.$($Matches[1])") {
            throw 'Executable and update checker versions must agree'
          }
          $package = 'artifacts/payload'
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item $exe, (Join-Path $project 'TEST_GUIDE.md'), 'LICENSE' $package
          $archive = "artifacts/NanharaBoard-$version-windows-x64-portable.zip"
          Compress-Archive -Path "$package/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -NoNewline "${archive}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-preview
          path: artifacts/*.zip*
          if-no-files-found: error
          retention-days: 7
