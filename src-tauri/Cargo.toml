[package]
name = "nanhara-board"
version = "0.1.2"
description = "Nanhara Board for touch displays and macOS"
authors = ["Wuxi Nanhara Tech"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nanhara_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
